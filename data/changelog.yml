# Machine-readable API changelog. Newest entry first.
#
# Source of truth for both /changelog.txt and /api-changelog.json.
#
# Fields:
#   date:        day the change went live (YYYY-MM-DD)
#   type:        added | breaking | deprecated
#   description: one or two short plain sentences. Name the endpoint or field that changed.
#   sunset:      deprecated entries only. Day the old behaviour stops (YYYY-MM-DD).
#                Leave it out when no date is known.
#
# PROOF OF CONCEPT (HMRC-2361): the two entries below are seed data. Both
# changes are in the published OpenAPI spec (source/openapi.yaml). Their dates
# are backend commit dates, not go-live dates. Check the dates with the backend
# team before you rely on this changelog.
#
# Not included: the removal of the v2 enquiry form alias (backend commit
# f5a34f626, 2026-09-29). The spec does not show it, and it is not known that
# the alias was ever public. Add it only after that is confirmed.

- date: 2026-09-14
  type: added
  description: >-
    The quotas search endpoint accepts the status filters `open` and
    `suspended`.

- date: 2026-09-09
  type: added
  description: >-
    Measure type resources include a `semantic_roles` attribute.
