---
default_install_hook_types:
  - pre-commit
  - pre-push
default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: local
    hooks:
      - id: briar
        name: Briar (offline secret scan)
        language: docker_image
        # Keep the image version and digest aligned with flake.nix.
        entry: ghcr.io/willfish/briar:v0.1.0@sha256:8e36caa3ef5892e45435d5388632d63f25e50224cee01678b82503eecc7cf728
        args: ["--"]
        types: [file]
        require_serial: true

  - repo: https://github.com/mattlqx/pre-commit-ruby
    rev: v1.3.6
    hooks:
      - id: rubocop
        args: ["--autocorrect"]

  - repo: https://github.com/rhysd/actionlint.git
    rev: v1.7.12
    hooks:
      - id: actionlint-docker
        args: [--no-rails, --, config.rb, bin, source, templates]
